repos:
  - repo: local
    hooks:
      - id: go-format
        name: Format Go
        entry: gofmt -w
        language: system
        files: '\.go$'

      - id: nix-format
        name: Format Nix
        entry: nixfmt
        language: system
        files: '\.nix$'

      - id: go-test
        name: Test Go with race detection
        entry: go test -race ./...
        language: system
        pass_filenames: false
        files: '\.go$|^go\.(mod|sum)$|^flake\.(nix|lock)$|^\.pre-commit-config\.yaml$'

      - id: go-vet
        name: Vet Go
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: '\.go$|^go\.(mod|sum)$|^flake\.(nix|lock)$|^\.pre-commit-config\.yaml$'

      - id: go-lint
        name: Lint Go
        entry: golangci-lint run ./...
        language: system
        pass_filenames: false
        files: '\.go$|^go\.(mod|sum)$|^flake\.(nix|lock)$|^\.pre-commit-config\.yaml$'
